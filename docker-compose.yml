services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskcheckerai:latest
    container_name: taskcheckerai
    ports:
      - "8000:8000"
    environment:
      # Ollama на хосте (host.docker.internal работает в Docker Desktop и через extra_hosts на Linux)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_MODEL: qwen2.5-coder:7b
      LLM_NUM_CTX: "16384"
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      # Внутри контейнера Docker-песочница недоступна. Локальный запуск включается
      # только явно и не даёт изоляции — не публикуйте такой контейнер в интернет.
      SANDBOX_BACKEND: local
      SANDBOX_ALLOW_LOCAL: "true"
      # Минимальная защита API: задайте ключ и лимит запросов для сетевого доступа.
      API_KEY: ""
      RATE_LIMIT_PER_MINUTE: "60"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
